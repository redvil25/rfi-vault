name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test -- --coverage

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder


  database:
    name: Migrations apply from an empty database
    runs-on: ubuntu-latest
    # Guards the failure that shipped once already: SQL applied straight to the
    # linked project and never committed, so a fresh `db reset` produced a
    # database the application could not query. Needs no secrets — it builds a
    # throwaway Postgres from supabase/migrations alone.
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start a local Supabase stack
        run: supabase start

      - name: Replay every migration from zero
        run: supabase db reset

      # One line per SQL object a feature calls by name. `hybrid_search` was
      # here until 0028 dropped it (ADR-039) and this step went red on a
      # function nothing calls any more — the assertion has to track what
      # actually runs or it stops meaning anything.
      - name: Assert the objects the application calls actually exist
        run: |
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "select 'search_considerations'::regproc;"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "select 'search_facets'::regproc;"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "select 'lexical_precedents'::regproc;"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "select 'mined_rules'::regproc;"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "select 'rule_precedents'::regproc;"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "select 'consume_rate_limit'::regproc;"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "select fts from rfi_consideration limit 0;"
        env:
          DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

      # The reverse assertion. 0028 dropped the vector arm and pgvector stays
      # installed on purpose, so nothing errors if a migration quietly brings
      # one of these back — it would just start costing what ADR-039 removed.
      - name: Assert the removed vector objects have stayed removed
        run: |
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "
            do \$\$
            declare bad text;
            begin
              select string_agg(name, ', ') into bad
              from unnest(array['hybrid_search','vector_search']) as name
              where to_regproc(name) is not null;
              if bad is not null then
                raise exception 'ADR-039 removed these and something re-added them: %', bad;
              end if;
              if to_regclass('public.rfi_embedding') is not null then
                raise exception 'rfi_embedding is back; 0028 dropped it (ADR-039)';
              end if;
            end
            \$\$;"
        env:
          DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

      # `create or replace function` with a changed argument list creates an
      # OVERLOAD rather than replacing, and Postgres then refuses any call it
      # cannot disambiguate. It passes migration, typecheck and build, and fails
      # at runtime on the first search. Overloads are always a mistake in this
      # schema, so any duplicate name fails the build (ADR-026).
      - name: Assert no database function has duplicate signatures
        run: |
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "
            do \$\$
            declare bad text;
            begin
              select string_agg(proname || ' x' || n, ', ')
                into bad
              from (
                select p.proname, count(*) as n
                from pg_proc p
                join pg_namespace ns on ns.oid = p.pronamespace
                where ns.nspname = 'public'
                group by p.proname
                having count(*) > 1
              ) dupes;
              if bad is not null then
                raise exception 'functions with more than one signature: %', bad;
              end if;
            end
            \$\$;"
        env:
          DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

      # A missing GRANT is invisible to both checks above: the objects exist and
      # RLS is on, but the policies are never consulted because the role cannot
      # reach the table at all. This is how 0015 came to be needed (ADR-022).
      - name: Assert the application roles can actually reach the tables
        run: |
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "
            do \$\$
            begin
              if not has_table_privilege('authenticated','public.rfi_consideration','SELECT') then
                raise exception 'authenticated cannot SELECT rfi_consideration - a GRANT is missing';
              end if;
              if not has_table_privilege('service_role','public.trial','INSERT') then
                raise exception 'service_role cannot INSERT trial - seeding and ingestion will fail';
              end if;
              if has_table_privilege('anon','public.rfi_consideration','SELECT') then
                raise exception 'anon can SELECT rfi_consideration - the repository is publicly readable';
              end if;
            end
            \$\$;"
        env:
          DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

      # RLS is the authorisation boundary for this application, so "is it on"
      # is a build-breaking question, not a review question. 0012 exists because
      # policies were once left open to the `anon` role.
      - name: Assert RLS is enabled on every public table
        run: |
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "
            do \$\$
            declare bad text;
            begin
              select string_agg(c.relname, ', ')
                into bad
              from pg_class c
              join pg_namespace n on n.oid = c.relnamespace
              where n.nspname = 'public'
                and c.relkind = 'r'
                and not c.relrowsecurity;
              if bad is not null then
                raise exception 'tables without row level security: %', bad;
              end if;
            end
            \$\$;"
        env:
          DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    # Four specs exist (e2e/), so the old reason for this gate is gone. The
    # remaining one is real: these sign in against the live EU project and file
    # rows, so the job needs the four secrets below actually set on the
    # repository. Enabling it without them fails on every push and teaches the
    # team to ignore a red build, which is worse than a job that does not run.
    #
    # To turn it on: add the secrets, change this to `if: true`, and expect the
    # specs to share one live database with whoever else is running them.
    if: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Groq is the generation provider (ADR-035). A Gemini key here would
          # set no provider at all and the drafting specs would read as broken.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
